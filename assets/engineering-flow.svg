
<svg xmlns="http://www.w3.org/2000/svg"
     width="700" height="120" viewBox="0 0 700 120">
  <title>Lawrence Engineering Workflow</title>

  <!-- Connection paths -->
  <g fill="none" stroke="#30363d" stroke-width="2">
    <path d="M40 60 H180 L270 20 H430 L520 60 H660"/>
    <path d="M180 60 L270 100 H430 L520 60"/>
  </g>

  <!-- Connection nodes -->
  <g fill="#0d1117" stroke="#8b949e" stroke-width="2">
    <circle cx="40" cy="60" r="5"/>
    <circle cx="180" cy="60" r="5"/>
    <circle cx="520" cy="60" r="5"/>
    <circle cx="660" cy="60" r="5"/>
  </g>

  <!-- Engineering nodes -->
  <g fill="#c9d1d9">
    <circle cx="350" cy="20" r="4"/>
    <circle cx="350" cy="100" r="4"/>
  </g>

  <!-- Animated primary signal -->
  <circle r="5" fill="#f0f6fc">
    <animateMotion
      dur="5s"
      repeatCount="indefinite"
      path="M40 60 H180 L270 20 H430 L520 60 H660"/>
  </circle>

  <!-- Animated secondary signal -->
  <circle r="4" fill="#8b949e">
    <animateMotion
      dur="5s"
      begin="2.5s"
      repeatCount="indefinite"
      path="M40 60 H180 L270 100 H430 L520 60 H660"/>
  </circle>

  <!-- Labels -->
  <g fill="#8b949e"
     font-family="monospace"
     font-size="11"
     letter-spacing="2">
    <text x="40" y="90">DESIGN</text>
    <text x="315" y="60">ENGINEER</text>
    <text x="620" y="90">SHIP</text>
  </g>
</svg>
